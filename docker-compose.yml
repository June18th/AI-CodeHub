services:
  mysql:
    image: mysql:8.0
    container_name: aicodehub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aicodehub}
      MYSQL_USER: ${MYSQL_USER:-aicodehub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aicodehub123}
      TZ: Asia/Shanghai
    command: --default-time-zone='+08:00'
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/databases/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - aicodehub-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aicodehub-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - aicodehub-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: aicodehub-es
    hostname: elasticsearch
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    extra_hosts:
      - "elasticsearch:127.0.0.1"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - aicodehub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: aicodehub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./minio-data:/data
    networks:
      - aicodehub-net

  kafka:
    image: apache/kafka:latest
    container_name: aicodehub-kafka
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    networks:
      - aicodehub-net
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicodehub-backend
    restart: unless-stopped
    volumes:
      - ./:/workspace
      - ./logs:/app/logs
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: docker
      FILESYSTEM_ROOT: /workspace
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-aicodehub}
      DB_USER: ${MYSQL_USER:-aicodehub}
      DB_PASSWORD: ${MYSQL_PASSWORD:-aicodehub123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      ES_URL: http://elasticsearch:9200
      MINIO_URL: http://minio:9000
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}
      KAFKA_BROKER: kafka:9092
      AI_GPT_API_KEY: ${AI_GPT_API_KEY:-}
      AI_GPT_BASE_URL: ${AI_GPT_BASE_URL:-https://api.openai.com/v1}
      AI_GPT_MODEL: ${AI_GPT_MODEL:-gpt-3.5-turbo}
      AI_ZHIPU_API_KEY: ${AI_ZHIPU_API_KEY:-}
      AI_ZHIPU_BASE_URL: ${AI_ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      AI_ZHIPU_MODEL: ${AI_ZHIPU_MODEL:-glm-4-flash}
      AI_QWEN_API_KEY: ${AI_QWEN_API_KEY:-}
      AI_QWEN_BASE_URL: ${AI_QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_QWEN_MODEL: ${AI_QWEN_MODEL:-qwen-turbo}
      AI_DEEPSEEK_API_KEY: ${AI_DEEPSEEK_API_KEY:-}
      AI_DEEPSEEK_BASE_URL: ${AI_DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      AI_DEEPSEEK_MODEL: ${AI_DEEPSEEK_MODEL:-deepseek-chat}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL:-gpt-3.5-turbo}
      AMAP_API_KEY: ${AMAP_API_KEY:-}
      MCP_COMMAND: ${MCP_COMMAND:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2048}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aicodehub-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicodehub-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${FRONTEND_PORT:-3000}:443"
      - "3080:80"
    volumes:
      - ./docker/config/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - aicodehub-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: aicodehub-prometheus
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
    volumes:
      - ./docker/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - aicodehub-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: aicodehub-grafana
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    volumes:
      - ./docker/config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - aicodehub-net
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:2.9.0
    container_name: aicodehub-loki
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./docker/config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - aicodehub-net

  promtail:
    image: grafana/promtail:2.9.0
    container_name: aicodehub-promtail
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./docker/config/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - backend-logs:/var/log/app:ro
    networks:
      - aicodehub-net
    depends_on:
      - loki

  backend-test:
    image: maven:3.9-eclipse-temurin-21-alpine
    container_name: aicodehub-test
    environment:
      TZ: Asia/Shanghai
    command: sleep infinity
    volumes:
      - ./backend:/app
      - maven-cache:/root/.m2
    working_dir: /app
    networks:
      - aicodehub-net

volumes:
  mysql-data:
  redis-data:
  es-data:
  minio-data:
  backend-logs:
  prometheus-data:
  grafana-data:
  loki-data:
  maven-cache:

networks:
  aicodehub-net:
    driver: bridge
