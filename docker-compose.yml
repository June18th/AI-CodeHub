services:
  mysql:
    image: mysql:8.0
    container_name: aicodehub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aicodehub}
      MYSQL_USER: ${MYSQL_USER:-aicodehub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aicodehub123}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/databases/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - aicodehub-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aicodehub-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - aicodehub-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: aicodehub-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - aicodehub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: aicodehub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./minio-data:/data
    networks:
      - aicodehub-net

  kafka:
    image: apache/kafka:latest
    container_name: aicodehub-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    networks:
      - aicodehub-net
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicodehub-backend
    restart: unless-stopped
    volumes:
      - ./:/workspace
    environment:
      SPRING_PROFILES_ACTIVE: docker
      FILESYSTEM_ROOT: /workspace
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-aicodehub}
      DB_USER: ${MYSQL_USER:-aicodehub}
      DB_PASSWORD: ${MYSQL_PASSWORD:-aicodehub123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      ES_URL: http://elasticsearch:9200
      MINIO_URL: http://minio:9000
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}
      KAFKA_BROKER: kafka:9092
      AI_GPT_API_KEY: ${AI_GPT_API_KEY:-}
      AI_GPT_BASE_URL: ${AI_GPT_BASE_URL:-https://api.openai.com/v1}
      AI_GPT_MODEL: ${AI_GPT_MODEL:-gpt-3.5-turbo}
      AI_ZHIPU_API_KEY: ${AI_ZHIPU_API_KEY:-}
      AI_ZHIPU_BASE_URL: ${AI_ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      AI_ZHIPU_MODEL: ${AI_ZHIPU_MODEL:-glm-4-flash}
      AI_QWEN_API_KEY: ${AI_QWEN_API_KEY:-}
      AI_QWEN_BASE_URL: ${AI_QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_QWEN_MODEL: ${AI_QWEN_MODEL:-qwen-turbo}
      AI_DEEPSEEK_API_KEY: ${AI_DEEPSEEK_API_KEY:-}
      AI_DEEPSEEK_BASE_URL: ${AI_DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      AI_DEEPSEEK_MODEL: ${AI_DEEPSEEK_MODEL:-deepseek-chat}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL:-gpt-3.5-turbo}
      AMAP_API_KEY: ${AMAP_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2048}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aicodehub-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicodehub-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - aicodehub-net

volumes:
  mysql-data:
  redis-data:
  es-data:
  minio-data:

networks:
  aicodehub-net:
    driver: bridge
