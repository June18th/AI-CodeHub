services:
  mysql:
    image: mysql:8.0
    container_name: aicodehub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aicodehub}
      MYSQL_USER: ${MYSQL_USER:-aicodehub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aicodehub123}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - aicodehub-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aicodehub-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis-data:/data
    networks:
      - aicodehub-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicodehub-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-aicodehub}
      DB_USER: ${MYSQL_USER:-aicodehub}
      DB_PASSWORD: ${MYSQL_PASSWORD:-aicodehub123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      AI_GPT_API_KEY: ${AI_GPT_API_KEY:-}
      AI_GPT_BASE_URL: ${AI_GPT_BASE_URL:-https://api.openai.com/v1}
      AI_GPT_MODEL: ${AI_GPT_MODEL:-gpt-3.5-turbo}
      AI_ZHIPU_API_KEY: ${AI_ZHIPU_API_KEY:-}
      AI_ZHIPU_BASE_URL: ${AI_ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      AI_ZHIPU_MODEL: ${AI_ZHIPU_MODEL:-glm-4-flash}
      AI_QWEN_API_KEY: ${AI_QWEN_API_KEY:-}
      AI_QWEN_BASE_URL: ${AI_QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_QWEN_MODEL: ${AI_QWEN_MODEL:-qwen-turbo}
      AI_DEEPSEEK_API_KEY: ${AI_DEEPSEEK_API_KEY:-}
      AI_DEEPSEEK_BASE_URL: ${AI_DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      AI_DEEPSEEK_MODEL: ${AI_DEEPSEEK_MODEL:-deepseek-chat}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL:-gpt-3.5-turbo}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aicodehub-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicodehub-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - aicodehub-net

networks:
  aicodehub-net:
    driver: bridge
