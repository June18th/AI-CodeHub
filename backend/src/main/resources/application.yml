server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 10000
    connection-timeout: 30000

spring:
  application:
    name: ai-codehub
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aicodehub}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:aicodehub}
    password: ${DB_PASSWORD:aicodehub123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 60000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
          time-between-eviction-runs: 60s
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:kafka:9092}
    consumer:
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

mcp:
  command: ${MCP_COMMAND:}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

ai:
  models:
    gpt:
      api-key: ${AI_GPT_API_KEY:}
      base-url: ${AI_GPT_BASE_URL:https://api.openai.com/v1}
      model: ${AI_GPT_MODEL:gpt-3.5-turbo}
    zhipu:
      api-key: ${AI_ZHIPU_API_KEY:}
      base-url: ${AI_ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      model: ${AI_ZHIPU_MODEL:glm-4-flash}
    qwen:
      api-key: ${AI_QWEN_API_KEY:}
      base-url: ${AI_QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${AI_QWEN_MODEL:qwen-turbo}
    deepseek:
      api-key: ${AI_DEEPSEEK_API_KEY:}
      base-url: ${AI_DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      model: ${AI_DEEPSEEK_MODEL:deepseek-chat}
    openai:
      api-key: ${AI_OPENAI_API_KEY:}
      base-url: ${AI_OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${AI_OPENAI_MODEL:gpt-3.5-turbo}

logging:
  level:
    com.aicodehub: debug
    root: info
    org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration: error

jwt:
  secret: ${JWT_SECRET:ai-codehub-2026-jwt-secret-key-min-256-bits!!}
  expiration: 3600000
  refresh-expiration: 604800000

# ---- Management & Observability ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ai-codehub

# ---- Rate Limiting (Bucket4j) ----
rate-limit:
  enabled: true
  default-rpm: 60
  chat-rpm: 20
  agent-rpm: 20
  admin-rpm: 120

# ---- Circuit Breaker (Resilience4j) ----
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      ai-model-call:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 60s

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql:3306/${DB_NAME:aicodehub}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
